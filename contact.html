<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <title>Vibe Tech - 聯絡我們</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo">Vibe Tech 智能小鋪</div>
        <ul class="nav-links">
            <li><a href="index.html">首頁</a></li>
            <li><a href="products.html">產品</a></li>
            <li><a href="cart.html">立即訂購</a></li>
            <li><a href="contact.html">聯絡我們</a></li>
        </ul>
    </nav>

    <div class="container" style="padding: 30px; max-width: 500px;">
        <h2>聯絡我們</h2>
        <p>如果有任何查詢，請填寫以下表格：</p>
        <!-- 呢個就係第 2 項要求嘅「表單」 -->
        <form style="background:white; padding:20px; border-radius:8px;">
            <div class="form-group">
                <label>姓名：</label>
                <input type="text" placeholder="請輸入姓名" style="width: 100%;">
            </div>
            <div class="form-group">
                <label>電郵：</label>
                <input type="email" placeholder="請輸入電郵" style="width: 100%;">
            </div>
            <div class="form-group">
                <label>訊息：</label>
                <textarea placeholder="請輸入查詢內容" style="width: 100%; height: 100px;"></textarea>
            </div>
            <button type="button" class="btn-calculate" style="background-color:#007bff;">送出</button>
        </form>
    </div>
</body>
</html>
